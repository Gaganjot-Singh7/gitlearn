name: Express Deploy

on:
  push:
    branches:
      - main  

jobs:
  build-and-run:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'   

      - name: Install dependencies
        run: npm install

      - name: Start server
        run: npm start